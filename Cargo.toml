[package]
name = "e3d-model"
version = "0.1.0"
edition = "2024"
description = "Model generation mirroring the core.dll/Core3D pipeline (ADDDES -> MODCMP -> ELMODL -> libgm), reading data through e3d-io"

[dependencies]
e3d-io = { path = "../e3d-io" }
e3d-attlib = { path = "../e3d-attlib" }
glam = "0.29"
# 与 gen-model ADR-029 同一份 CSG 内核（对标 libgm），同 rev 以复用共享 target 的 C++ 编译缓存。
manifold-csg = { git = "https://github.com/zmerlynn/manifold-csg", rev = "2233c5a1162eba981e3f43efcd39a6bc25581335" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 面片带孔三角剖分（POLYHE B-rep 建体用）：与 gen-model `append_planar_face` 同算法同版本。
earcutr = "0.4.3"

[dev-dependencies]
# RVM 对拍取证（examples 用）：与 gen-model rvm_verify 同一解析器、同一 rev（命中本机 git 缓存）。
rvm-rs = { git = "https://github.com/happyrust/rvm-rs", rev = "45470d2a0ddcabcd1f11958362e6440865bfc24e" }
